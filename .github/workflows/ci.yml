name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend lint, typecheck, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trustgate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: trustgate_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trustgate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: |
          .venv/bin/python -m ruff check app tests alembic
          .venv/bin/python -m ruff format --check app tests alembic
      - name: Typecheck
        working-directory: backend
        run: .venv/bin/python -m mypy
      - name: Test
        working-directory: backend
        env:
          APP_ENV: test
          CORS_ALLOWED_ORIGIN: http://localhost:5173
          TEST_DATABASE_URL: postgresql://postgres:trustgate_test_only@127.0.0.1:5432/trustgate_test
        run: .venv/bin/python -m pytest

  frontend:
    name: Frontend lint, typecheck, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
